<font color="#666666"><span style="font-size: 16pt">　<u>阿含經隨身剪輯</u>(紙本311頁) 莊春江 剪輯 (不同意被抄襲或營利性引用)<br><br><font color="#006A00">
<p align="left" style="line-height: 200%; text-indent: -30; margin-left: 60; margin-right: 5"><span style="font-size: 18pt">
凡　　　例

<br>1.中‧一四一表示該段經文，摘自漢譯《中阿含》第一四一經；
<br> 增‧二二五表示該段經文，摘自漢譯《增壹阿含》第二二五經；
<br> 雜‧四０　表示該段經文，摘自漢譯《雜阿含》第四０經；
<br> 長‧二　　表示該段經文，摘自漢譯《長阿含》第二經；
<br>經號以《佛光大藏經》本為準。

<br>2.《大正‧二九‧六七五上》表示大正版《大藏經》第二九冊第六七五頁
<br>上段。

<br>3.「※」符號處，為剪輯者對該段經文之贅言，僅供參考。

<br>4.經文中，（　）內之文字，或為不同經本之用字，或為不同的翻譯用字
<br>，或為詮釋之用，而使經文更容易暸解者。
<br>

</p>
