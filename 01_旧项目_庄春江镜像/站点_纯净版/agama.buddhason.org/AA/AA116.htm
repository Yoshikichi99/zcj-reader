<br><u>增壹阿含15品7經[佛光本116經/2法]</u>(有無品)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">聞如是</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>在舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「有此二法，<a onMouseover="note(this,114);">內自思惟</a>，專精一意，當禮<a onMouseover="note(this,4);">如來</a>，云何為二法？一為智慧，二為滅盡。是謂，比丘！內自思惟，專精一意，當禮如來。如是，諸比丘！當作是學。」
<br>　　爾時，諸比丘聞佛所說，歡喜奉行。
