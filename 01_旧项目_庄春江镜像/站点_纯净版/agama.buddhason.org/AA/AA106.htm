<br><u>增壹阿含14品7經[佛光本106經/1法]</u>(五戒品)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">聞如是</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>在舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「於此眾中，我不見<a onMouseover="note(this,522);">一法</a>修行已、多修行已，成地獄行，<a onMouseover="note(this,362);">餓鬼</a>、畜生行，若生人中，口氣臭惡，為人所憎，所謂<a onMouseover="note(this,106);">妄語</a>。諸比丘！若有人<a onMouseover="note(this,106);">妄言</a>、<a onMouseover="note(this,236);">綺語</a>、<a onMouseover="note(this,234);">鬪亂是非</a>，便墮[地獄、]畜生、餓鬼中。所以者何？以其妄語故也。
<br>　　是故，[諸比丘！常]當至誠，莫得妄語。是故，諸比丘！當作是學。」
<br>　　爾時，諸比丘聞佛所說，歡喜奉行。
