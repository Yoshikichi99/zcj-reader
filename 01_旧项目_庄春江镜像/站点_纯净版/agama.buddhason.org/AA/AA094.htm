<br><u>增壹阿含13品2經[佛光本94經/1法]</u>(利養品)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">聞如是</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>在舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「當滅<a onMouseover="note(this,522);">一法</a>，我證汝等成{果?}<a onMouseover="note(this,503);">神通</a>，諸<a onMouseover="note(this,188);">漏</a>得盡，云何為一法？所謂<a onMouseover="note(this,295);">味</a>欲。是故，諸比丘！當滅此味欲，我證汝等成神通{果}，諸漏得盡。」
<br>　　爾時，世尊便說此偈：
<br>　　「眾生著此味，死墮<a onMouseover="note(this,110);">惡趣</a>中，今當捨此欲，便成<a onMouseover="note(this,5);">阿羅漢</a>。
<br>　　是故，諸比丘！常當捨此味著之想。如是，諸比丘！當作是學。」
<br>　　爾時，諸比丘聞佛所說，歡喜奉行。
