<br><u>增壹阿含7品2經[佛光本41經/1法]</u>(清信女品)(莊春江標點)
<br>　　「我弟子中第一<a onMouseover="note(this,99);">優婆斯</a>：
<br>　　供養<a onMouseover="note(this,4);">如來</a>，所謂摩利夫人是。
<br>　　承事正法，所謂須賴婆夫人是。
<br>　　供養聖眾，捨彌夫人是。
<br>　　瞻視當來過去賢士，所謂月光夫人是。
<br>　　<a onMouseover="note(this,248);">檀越</a>第一，雷電夫人是。
<br>　　恒行慈<a onMouseover="note(this,182);">三昧</a>，所謂摩訶光優婆斯是。
<br>　　行悲哀愍，毘提優婆斯是。
<br>　　喜心不絕，拔{提}[陀]優婆斯是。
<br>　　行守護業，難陀母優婆斯是。
<br>　　得<a onMouseover="note(this,579);">信解脫</a>，照曜優婆斯是。」
<br>　　摩利、須賴婆，捨彌、{光月}[月光]、雷，大光、毘提、陀，難陀及照曜。
