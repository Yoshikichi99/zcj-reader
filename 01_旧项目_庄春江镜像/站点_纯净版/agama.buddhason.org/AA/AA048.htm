<br><u>增壹阿含8品6經[佛光本48經/1法]</u>(阿須倫品)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">聞如是</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>在舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若有一人出現於世，便有三十七品出現於世。云何三十七品道？所謂<a onMouseover="note(this,286);">四意止</a>、<a onMouseover="note(this,292);">四意斷</a>、<a onMouseover="note(this,503);">四神足</a>、五根、五力、<a onMouseover="note(this,524);">七覺意</a>、<a onMouseover="note(this,525);">八真行</a>，便出現於世，云何為一人？所謂<a onMouseover="note(this,4);">多薩阿竭</a>、<a onMouseover="note(this,5);">阿羅呵</a>、<a onMouseover="note(this,6);">三耶三佛</a>。
<br>　　是故，諸比丘！常當承事於佛，亦當作是學。」
<br>　　爾時，諸比丘聞佛所說，歡喜奉行。
