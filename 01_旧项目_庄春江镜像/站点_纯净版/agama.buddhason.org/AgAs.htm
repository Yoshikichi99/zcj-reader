<span style="font-size:26pt"><font face="標楷體"><font color="#808000"><b>
理　　念：</b><br><span style="font-size:24pt"><font color="#808080">
阿含經是佛教的根本經典，佛教各宗派發展的根源，佛弟子畢生中必讀的聖典。<br><br>
<span style="font-size:26pt"><font color="#808000"><b>
使　　命：</b><br><span style="font-size:24pt"><font color="#808080">
學習阿含經、推廣阿含經之學習(無關大小乘之爭)。
<br><br>
<span style="font-size:26pt"><font color="#808000"><b>
服　　務：</b><br><span style="font-size:24pt"><font color="#808080">
隨分隨力地提供研讀阿含經的友善環境。
<br><br>
<span style="font-size:26pt"><font color="#808000"><b>
主　　張：</b><br><span style="font-size:24pt"><font color="#808080">
從雜阿含第1經開始，以南北傳經文比對方式逐經研讀，從中發掘佛法核心教義，開發適合自己的實踐方法。</span>
