<br><u>雜阿含519經[正聞本1586-1588經/佛光本518經]</u>(目犍連相應/雜因誦/弟子記說)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住王舍城。……乃至路中見一眾生，以銅鐵羅網自纏其身，火常熾然，還燒其體，痛徹骨髓，乘虛而行。
<br>　　佛告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「此眾生者，過去世時，於此王舍城為捕魚師，緣斯罪故，已地獄中受無量苦。地獄餘罪，今受此身，續受斯苦。
<br>　　諸比丘！如大目犍連所見，真實不異，當<a onMouseover="note(this,57);">受持</a>之。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如捕魚師，捕鳥、網兔亦復如是。
