<br><u>雜阿含745經[正聞本942-945經/佛光本757經]</u>(覺支相應/道品誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若比丘修空入處，多<a onMouseover="note(this,94);">修習</a>已，得<a onMouseover="note(this,113);">大果、大福利</a>。
<br>　　云何比丘修空入處，多修習已，得大果、大福利？是比丘心與空入處俱修<a onMouseover="note(this,315);">念覺分</a>，<a onMouseover="note(this,322);">依遠離</a>、依無欲、依滅、<a onMouseover="note(this,221);">向於捨</a>……乃至修<a onMouseover="note(this,314);">捨覺分</a>，依遠離、依無欲、依滅、向於捨。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如修空入處，如是，識入處、<a onMouseover="note(this,533);">無所有入處</a>、<a onMouseover="note(this,534);">非想非非想入處</a>三經亦如上說。
