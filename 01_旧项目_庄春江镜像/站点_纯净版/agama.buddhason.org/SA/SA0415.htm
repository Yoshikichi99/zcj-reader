<br><u>雜阿含415經[正聞本607經/佛光本414經]</u>(諦相應/雜因誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住王舍城迦蘭陀竹園。
<br>　　時，有眾多<a onMouseover="note(this,31);">比丘</a>集於食堂，作如是{說}論[說]：
<br>　　「某甲<a onMouseover="note(this,248);">檀越</a>作麁疏食，我等食已，無味無力。我等不如捨彼麁食而行<a onMouseover="note(this,87);">乞食</a>，所以者何？比丘乞食，時得好食，又見好色，時聞好聲，多人所識，亦得衣被、臥具、醫藥。」
<br>　　爾時，世尊於禪定中以天耳聞諸比丘論說之聲，即詣食堂……如是廣說……乃至正向涅槃。
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
