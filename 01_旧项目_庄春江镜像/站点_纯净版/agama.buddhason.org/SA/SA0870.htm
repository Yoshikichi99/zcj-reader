<br><u>雜阿含870經[正聞本12895-12899經/佛光本584經]</u>(天相應/雜因誦/如來記說)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若比丘如是行、如是形、如是相，離苦息樂，前憂喜已滅，不苦不樂，<a onMouseover="note(this,494);">捨淨念</a>、<a onMouseover="note(this,255);">一心</a>，第四禪<a onMouseover="note(this,66);">具足住</a>。
<br>　　若不如是憶念，而於色、受、想、行、識思惟：如病、如癰、如刺、<a onMouseover="note(this,734);">如殺</a>……乃至<a onMouseover="note(this,301);">上流般涅槃</a>；若不爾者，或生因性果實天；若不爾者，生福生天；若不爾者，生少福天。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如四禪，如是，四無色定亦如是說。
