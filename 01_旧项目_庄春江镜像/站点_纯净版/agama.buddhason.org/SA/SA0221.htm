<br><u>雜阿含221經[正聞本288經/佛光本223經]</u>(入處相應/六入處誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「有趣一切取道跡，云何為趣一切取道跡？<a onMouseover="note(this,252);">緣</a>眼、色，生眼識，<a onMouseover="note(this,195);">三事和合觸</a>，觸緣受，受緣愛，愛緣取，取所取故；耳、鼻、舌、身、意亦復如是，取所取故，是名趣一切取道跡。
<br>　　云何斷一切取道跡？緣眼、色，生眼識，三事和合觸，觸滅則受滅，受滅則愛滅，愛滅則取滅，如是知；耳、鼻、舌、身、意亦復如是。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
