<br><u>雜阿含443經[正聞本682-691經/佛光本442經]</u>(諦相應/雜因誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「我本未聞法時，得<a onMouseover="note(this,114);">正思惟</a>：『此苦聖諦正見已生；此苦集聖諦、此苦滅聖諦、苦<a onMouseover="note(this,69);">滅道跡</a>聖諦正見已生。』」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如已生，如是，今生、當生[亦如是]。
<br>　　如生，如是，起、習、近、修、多修、觸、作證亦如是。
