<br><u>雜阿含863經[正聞本12876-12888經/佛光本577經]</u>(天相應/雜因誦/如來記說)(莊春江標點)
<br>　　如是我聞，一時，佛住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「<a onMouseover="local(this,1);">人間千六百歲是<a onMouseover="note(this,372);">他化自在天</a>一日一夜</a>，如是，三十日一月，十二月一歲，他化自在天壽一萬六千歲，<a onMouseover="note(this,74);">愚癡無聞凡夫</a>於彼命終，生地獄、畜生、<a onMouseover="note(this,362);">餓鬼</a>中；<a onMouseover="note(this,24);">多聞聖弟子</a>於彼命終，不生地獄、畜生、餓鬼中。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如佛說六經，如是，<a onMouseover="note(this,39);">異比丘</a>問六經、佛問諸比丘六經亦如是說。
