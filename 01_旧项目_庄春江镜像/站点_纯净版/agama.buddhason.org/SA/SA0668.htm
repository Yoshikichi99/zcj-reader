<br><u>雜阿含668經[正聞本865經/佛光本680經]</u>(力相應/道品誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，世尊告諸<a onMouseover="note(this,31);">比丘</a>（，如上說，差別者）：
<br>　　「若最勝施者，謂：法施；最勝愛語者，謂：<a onMouseover="note(this,41);">善男子</a>樂聞應時說法；行利最勝者，{諸}[謂]：不信者能令入信，建立於信、立戒者以淨戒、慳者以施、惡智者以正智令入建立；同利最勝者，謂：<a onMouseover="note(this,5);">阿羅漢</a>以阿羅漢、<a onMouseover="note(this,209);">阿那含</a>以阿那含、<a onMouseover="note(this,208);">斯陀含</a>以斯陀含、<a onMouseover="note(this,165);">須陀洹</a>以須陀洹、淨戒者以淨[戒]而授於彼。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
