<br><u>雜阿含128經[正聞本1683-1696經/佛光本130經]</u>(羅陀相應/五陰誦/弟子記說)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住摩拘羅山。
<br>　　時，有侍者<a onMouseover="note(this,31);">比丘</a>名曰羅陀。
<br>　　爾時，世尊告羅陀言：
<br>　　「諸所有色，若過去、若未來、若現在，若內、若外，若麁、若細，若好、若醜，若遠、若近，彼一切當觀皆是<a onMouseover="note(this,273);">斷法</a>；觀察已，於色欲貪斷；{色}[欲]貪斷已，我說心<a onMouseover="note(this,28);">善解脫</a>；受、想、行、識亦復如是。」
<br>　　佛說此經已，羅陀比丘聞佛所說，歡喜奉行。
<br>　　如是比，十四經亦如上說。
