<br><u>雜阿含831經[正聞本1122經/佛光本843經]</u>(學相應/道品誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若諸<a onMouseover="note(this,135);">上座</a>長老比丘初始不樂學戒、不重於戒，見餘比丘初樂學戒、重於戒、讚歎制<a onMouseover="note(this,392);">戒</a>者，彼亦不隨時讚歎，我於此等比丘所，亦不讚歎，以其初始不樂學戒故，所以者何？若<a onMouseover="note(this,145);">大師</a>讚歎彼者，餘人當復習近、親重、同其所見；以同其所見故，<a onMouseover="note(this,51);">長夜</a>當受不<a onMouseover="note(this,50);">饒益</a>苦。
<br>　　是故，我於彼長老……，中年、少年亦復如是，樂學戒者，如前說。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
