<br><u>雜阿含1354經[正聞本1467經/佛光本1351經]</u>(林相應/八眾誦/祇夜)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住迦蘭陀竹園。
<br>　　時，有<a onMouseover="note(this,39);">異比丘</a>在恒河側，住一林中。
<br>　　時，有一族姓女，常為舅姑所責，至恆水岸邊，而說偈言：
<br>　　「恒水我今欲，隨流徐入海，不復令舅姑，數數見嫌責。」
<br>　　時，彼比丘見族姓女，聞其說偈，作是念：
<br>　　「彼族姓女尚能說偈，我今何為不說偈答耶？」即說偈言：
<br>　　「<a onMouseover="note(this,340);">淨信</a>我今欲，隨彼八聖水，徐流入涅槃，不見<a onMouseover="note(this,157);">魔自在</a>。」
<br>　　時，彼比丘說此偈已，默然而住。
