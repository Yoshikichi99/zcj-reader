<br><u>雜阿含898經[正聞本13134-13143經/佛光本612經]</u>(入界陰相應/雜因誦/如來記說)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住王舍城迦蘭陀竹園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若比丘於眼欲貪斷，欲貪斷者，是名眼已斷、已知，斷其根本，<a onMouseover="note(this,147);">如截多羅樹頭</a>，<a onMouseover="note(this,229);">於未來世成不生法</a>。如眼，如是，耳、鼻、舌、身、意亦如是說。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如內六入處，如是外六入處，乃至五陰亦如是說。
