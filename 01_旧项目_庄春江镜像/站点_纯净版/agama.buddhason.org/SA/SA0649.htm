<br><u>雜阿含649經[正聞本821經/佛光本661經]</u>(根相應/道品誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，世尊告諸<a onMouseover="note(this,31);">比丘</a>，如上說，<a onMouseover="local(this,1);">差別者</a>：
<br>　　「若比丘於此五根如實觀察已，得盡諸漏，離欲解脫，是名<a onMouseover="note(this,5);">阿羅漢</a>：諸漏已盡，<a onMouseover="note(this,20);">所作已作</a>，離諸重擔，<a onMouseover="note(this,189);">逮得己利</a>，<a onMouseover="note(this,190);">盡諸有結</a>，<a onMouseover="note(this,976);">正智</a>心得解脫。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
