<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　如上說，差別者：
<br>　　「如是<a onMouseover="note(this,31);">比丘</a><a onMouseover="note(this,94);">修習</a><a onMouseover="note(this,524);">七覺分</a>已，多修習已，得四種果、四種福利，何等為四？謂：<a onMouseover="note(this,165);">須陀洹</a>果、<a onMouseover="note(this,208);">斯陀含</a>果、<a onMouseover="note(this,209);">阿那含</a>果、<a onMouseover="note(this,5);">阿羅漢</a>果。」
<br>　　佛說此經已，<a onMouseover="note(this,39);">異比丘</a>聞佛所說，歡喜奉行。
