<br><u>雜阿含1130經[正聞本13193-13220經/佛光本882經]</u>(不壞淨相應/道品誦/如來記說)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若於彼處有比丘<a onMouseover="note(this,150);">經行</a>，於彼處四<a onMouseover="note(this,29);">沙門</a>果中得一一果者，彼比丘<a onMouseover="note(this,64);">盡其形壽</a>常念彼處。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如經行處，如是，住處、坐處、臥處亦如是說。
<br>　　如{是}比丘，如是，比丘尼、<a onMouseover="note(this,630);">式叉摩尼</a>、<a onMouseover="note(this,290);">沙彌</a>、沙彌尼、<a onMouseover="note(this,98);">優婆塞</a>、<a onMouseover="note(this,99);">優婆夷</a>一一四經如上說。
