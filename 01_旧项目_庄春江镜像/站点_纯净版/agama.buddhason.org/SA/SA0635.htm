<br><u>雜阿含635經[正聞本805-809經/佛光本649經]</u>(念處相應/道品誦/修多羅)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住巴連弗邑雞林精舍。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「若比丘於<a onMouseover="note(this,286);">四念處</a><a onMouseover="note(this,94);">修習</a>、多修習，未淨眾生令得清淨，已淨眾生令增光澤，何等為四？謂：<a onMouseover="note(this,176);">身身觀</a>念住；受……心……法法觀念住。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
<br>　　如淨眾生，如是，未度<a onMouseover="note(this,226);">彼岸</a>者令度、得<a onMouseover="note(this,5);">阿羅漢</a>、得<a onMouseover="note(this,243);">辟支佛</a>、得<a onMouseover="note(this,37);">阿耨多羅三藐三菩提</a>亦如上說。
