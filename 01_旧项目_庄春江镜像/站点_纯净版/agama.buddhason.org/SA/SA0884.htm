<br><u>雜阿含884經[正聞本12956經/佛光本598經]</u>(修證相應/雜因誦/如來記說)(莊春江標點)
<br>　　<a onMouseover="note(this,1);">如是我聞</a>：
<br>　　<a onMouseover="note(this,2);">一時</a>，<a onMouseover="note(this,3);">佛</a>住舍衛國祇樹給孤獨園。
<br>　　爾時，<a onMouseover="note(this,12);">世尊</a>告諸<a onMouseover="note(this,31);">比丘</a>：
<br>　　「有<a onMouseover="note(this,193);">無學</a><a onMouseover="note(this,133);">三明</a>，何等為三？無學宿命智證通、無學生死智證通、無學<a onMouseover="note(this,437);">漏盡智</a>證通。」
<br>　　爾時，世尊即說偈言：
<br>　　「觀察知宿命，見天<a onMouseover="note(this,110);">惡趣</a>生，生死諸漏盡，是則<a onMouseover="note(this,125);">牟尼</a>明。
<br>　　　其心得解脫，一切諸貪愛，三{夜}[處]悉通達，故說為三明。」
<br>　　佛說此經已，諸比丘聞佛所說，歡喜奉行。
